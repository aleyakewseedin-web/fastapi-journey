<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LivePoll</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --text: #e2e8f0;
    --muted: #64748b;
    --success: #10b981;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  header {
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  #ws-status {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
    transition: all 0.3s;
  }
  #ws-status.connected { color: var(--success); border-color: var(--success); }
  #ws-status.disconnected { color: var(--danger); border-color: var(--danger); }

  main {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 0;
    height: calc(100vh - 65px);
    overflow: hidden;
  }

  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #polls-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.75rem;
  }

  #polls-list::-webkit-scrollbar { width: 4px; }
  #polls-list::-webkit-scrollbar-track { background: transparent; }
  #polls-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .poll-item {
    padding: 0.875rem 1rem;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    margin-bottom: 0.4rem;
    transition: all 0.2s;
  }

  .poll-item:hover { background: var(--border); border-color: var(--border); }
  .poll-item.active {
    background: rgba(124, 58, 237, 0.12);
    border-color: rgba(124, 58, 237, 0.4);
  }

  .poll-item-q {
    font-weight: 500;
    font-size: 0.88rem;
    margin-bottom: 0.3rem;
    line-height: 1.4;
  }

  .poll-item-meta {
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
  }

  .poll-item-del {
    float: right;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    padding: 0 0.2rem;
    line-height: 1;
    transition: color 0.2s;
  }
  .poll-item-del:hover { color: var(--danger); }

  .create-section {
    padding: 1.25rem 1.5rem;
    border-top: 1px solid var(--border);
  }

  .create-section h3 {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 0.875rem;
  }

  input, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem 0.875rem;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 0.6rem;
  }

  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: none; min-height: 60px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1.25rem;
    border-radius: 6px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    width: 100%;
  }
  .btn-primary:hover { background: #6d28d9; }

  .content {
    padding: 2rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .content::-webkit-scrollbar { width: 4px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-align: center;
    gap: 0.75rem;
  }

  #empty-state .icon { font-size: 3rem; opacity: 0.4; }
  #empty-state p { font-size: 0.9rem; }

  .poll-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.75rem;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .poll-card-question {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    line-height: 1.35;
  }

  .poll-card-id {
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }

  .options-grid { display: flex; flex-direction: column; gap: 0.75rem; }

  .option-row { display: flex; flex-direction: column; gap: 0.35rem; }

  .option-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.88rem;
  }

  .option-name { font-weight: 500; }

  .option-count {
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .progress-track {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .vote-btn {
    margin-top: 0.4rem;
    padding: 0.45rem 1rem;
    background: rgba(124, 58, 237, 0.1);
    border: 1px solid rgba(124, 58, 237, 0.3);
    border-radius: 5px;
    color: var(--accent);
    font-size: 0.82rem;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    align-self: flex-start;
  }
  .vote-btn:hover { background: rgba(124, 58, 237, 0.25); border-color: var(--accent); }

  .total-votes {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 1.25rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    color: var(--success);
    padding: 0.25rem 0.6rem;
    border: 1px solid rgba(16,185,129,0.3);
    border-radius: 999px;
    margin-bottom: 1rem;
  }

  .live-dot {
    width: 6px; height: 6px;
    background: var(--success);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .log-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
  }

  .log-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 0.875rem;
  }

  #event-log {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    max-height: 120px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .log-entry { color: var(--muted); }
  .log-entry.info { color: var(--accent2); }
  .log-entry.success { color: var(--success); }
  .log-entry.error { color: var(--danger); }

  .hint {
    font-size: 0.78rem;
    color: var(--muted);
    background: rgba(6,182,212,0.06);
    border: 1px solid rgba(6,182,212,0.15);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <div class="logo">⚡ LivePoll</div>
  <div id="ws-status">⬤ disconnected</div>
</header>

<main>
  <div class="sidebar">
    <div class="sidebar-header">
      <span>Polls</span>
      <span id="poll-count" style="font-size:0.75rem;">0</span>
    </div>
    <div id="polls-list"></div>
    <div class="create-section">
      <h3>New Poll</h3>
      <input type="text" id="new-question" placeholder="Question…" />
      <textarea id="new-options" placeholder="Options, one per line…"></textarea>
      <button class="btn btn-primary" onclick="createPoll()">+ Create Poll</button>
    </div>
  </div>

  <div class="content" id="main-content">
    <div id="empty-state">
      <div class="icon">📊</div>
      <p>Select a poll or create one to get started.</p>
    </div>
  </div>
</main>

<script>
const API = `http://localhost:8000`;
const WS_BASE = `ws://localhost:8000/ws/polls`;

let polls = {};
let activePollId = null;
let ws = null;

// --- Init ---
async function init() {
  await loadPolls();
  log('App ready', 'info');
}

// --- Load all polls ---
async function loadPolls() {
  try {
    const res = await fetch(`${API}/polls`);
    const list = await res.json();
    polls = {};
    list.forEach(p => polls[p.id] = p);
    renderPollList();
  } catch(e) {
    log('Failed to load polls: ' + e.message, 'error');
  }
}

// --- Create poll ---
async function createPoll() {
  const question = document.getElementById('new-question').value.trim();
  const options = document.getElementById('new-options').value
    .split('\n').map(s => s.trim()).filter(Boolean);
  if (!question || options.length < 2) {
    log('Need a question and at least 2 options', 'error');
    return;
  }
  try {
    const res = await fetch(`${API}/polls`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, options })
    });
    const poll = await res.json();
    polls[poll.id] = poll;
    renderPollList();
    document.getElementById('new-question').value = '';
    document.getElementById('new-options').value = '';
    log(`Created: "${poll.question}"`, 'success');
    selectPoll(poll.id);
  } catch(e) {
    log('Error creating poll: ' + e.message, 'error');
  }
}

// --- Delete poll ---
async function deletePoll(id, e) {
  e.stopPropagation();
  try {
    await fetch(`${API}/polls/${id}`, { method: 'DELETE' });
    delete polls[id];
    if (activePollId === id) {
      activePollId = null;
      if (ws) { ws.close(); ws = null; }
      renderContent(null);
    }
    renderPollList();
    log('Poll deleted', 'info');
  } catch(e) {
    log('Error deleting: ' + e.message, 'error');
  }
}

// --- Select poll & connect WS ---
function selectPoll(id) {
  activePollId = id;
  renderPollList();
  connectWebSocket(id);
  renderContent(polls[id]);
}

// --- WebSocket connect ---
function connectWebSocket(pollId) {
  if (ws) ws.close();
  ws = new WebSocket(`${WS_BASE}/${pollId}`);

  ws.onopen = () => {
    setWsStatus(true);
    log(`WS connected to poll ${pollId.slice(0,8)}…`, 'success');
  };

  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.type === 'connected') {
      polls[pollId] = msg.poll;
      renderContent(msg.poll);
      log('Poll state received', 'info');
    } else if (msg.type === 'update') {
      polls[pollId] = msg.poll;
      renderContent(msg.poll);
      log('Live update received!', 'success');
    } else if (msg.type === 'error') {
      log('WS error: ' + msg.detail, 'error');
    }
  };

  ws.onclose = () => {
    setWsStatus(false);
    log('WS disconnected', 'info');
  };

  ws.onerror = () => {
    log('WS error', 'error');
  };
}

// --- Vote via WebSocket ---
function voteWS(option) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    log('WS not connected, falling back to REST…', 'info');
    voteREST(activePollId, option);
    return;
  }
  ws.send(JSON.stringify({ type: 'vote', option }));
  log(`Voted: "${option}" (WS)`, 'success');
}

// --- Vote via REST (fallback) ---
async function voteREST(pollId, option) {
  try {
    const res = await fetch(`${API}/polls/${pollId}/vote`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ option })
    });
    const poll = await res.json();
    polls[pollId] = poll;
    renderContent(poll);
    log(`Voted: "${option}" (REST)`, 'success');
  } catch(e) {
    log('Vote failed: ' + e.message, 'error');
  }
}

// --- Render ---
function renderPollList() {
  const el = document.getElementById('polls-list');
  const ids = Object.keys(polls);
  document.getElementById('poll-count').textContent = ids.length;
  if (!ids.length) { el.innerHTML = '<p style="padding:1rem;font-size:0.8rem;color:var(--muted);text-align:center;">No polls yet</p>'; return; }
  el.innerHTML = ids.map(id => {
    const p = polls[id];
    const total = Object.values(p.options).reduce((a,b)=>a+b,0);
    return `<div class="poll-item ${id===activePollId?'active':''}" onclick="selectPoll('${id}')">
      <button class="poll-item-del" onclick="deletePoll('${id}',event)">✕</button>
      <div class="poll-item-q">${p.question}</div>
      <div class="poll-item-meta">${total} vote${total!==1?'s':''} · ${Object.keys(p.options).length} options</div>
    </div>`;
  }).join('');
}

function renderContent(poll) {
  const el = document.getElementById('main-content');
  if (!poll) {
    el.innerHTML = `<div id="empty-state"><div class="icon">📊</div><p>Select a poll or create one.</p></div>`;
    return;
  }
  const total = Object.values(poll.options).reduce((a,b)=>a+b,0);
  const optHTML = Object.entries(poll.options).map(([opt, count]) => {
    const pct = total ? Math.round(count/total*100) : 0;
    return `<div class="option-row">
      <div class="option-label">
        <span class="option-name">${opt}</span>
        <span class="option-count">${count} (${pct}%)</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <button class="vote-btn" onclick="voteWS('${opt.replace(/'/g,"\\'")}')">Vote →</button>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="poll-card">
      <div class="live-badge"><div class="live-dot"></div> LIVE</div>
      <div class="poll-card-question">${poll.question}</div>
      <div class="poll-card-id">ID: ${poll.id}</div>
      <div class="options-grid">${optHTML}</div>
      <div class="total-votes">Total votes: ${total}</div>
    </div>
    <div class="log-section">
      <div class="log-title">Event Log</div>
      <div id="event-log"></div>
    </div>
    <div class="hint">💡 Open this page in another tab and vote — results update in real-time via WebSocket. The REST endpoint <code>POST /polls/{id}/vote</code> is used as fallback.</div>
  `;
}

function setWsStatus(connected) {
  const el = document.getElementById('ws-status');
  el.className = connected ? 'connected' : 'disconnected';
  el.textContent = connected ? '⬤ connected' : '⬤ disconnected';
}

function log(msg, type='') {
  const el = document.getElementById('event-log');
  if (!el) return;
  const t = new Date().toLocaleTimeString('en-US',{hour12:false});
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  entry.textContent = `[${t}] ${msg}`;
  el.prepend(entry);
  while (el.children.length > 30) el.removeChild(el.lastChild);
}

init();
</script>
</body>
</html>
